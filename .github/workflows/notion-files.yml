name: فهرس الملفات في نوشن

on:
  push:
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/notion-files.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_FILES_DB: 8cd6f9f32a6a4d0e91e21a92cdac02e9
          NOTION_PROJECT_PAGE: 3c800fc1-57cf-81ad-a9a1-c0de8c056baf
